name: GPU runner pre-flight

on:
  workflow_dispatch:

jobs:
  gpu-runner-preflight:
    runs-on: [self-hosted, linux, gpu]

    steps:
      - uses: actions/checkout@v4

      - name: Install fitctl
        run: cargo install fitctl --locked

      - name: Survey host
        run: |
          fitctl survey \
            --enable-extension fitctl.runtime.cuda \
            > gpu.survey.json

      - name: Derive host contract
        run: |
          fitctl contract \
            --survey gpu.survey.json \
            --policy configs/policy/general_compute_default.v1.json \
            --enable-extension fitctl.runtime.cuda \
            > gpu.contract.json

      - name: Capture CUDA runtime state
        run: |
          fitctl state \
            --enable-extension fitctl.runtime.cuda \
            > gpu.state.json

      - name: Validate runner
        run: |
          fitctl validate \
            --contract gpu.contract.json \
            --profile configs/service_profiles/general_compute_cuda_runtime_allocatable_memory_required.v2.json \
            --state gpu.state.json \
            --validation-mode state_required \
            --require-fit \
            > validation.json

      - name: Inspect validation result
        if: always()
        run: fitctl inspect --input validation.json
